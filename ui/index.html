<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Casio MT-40</title>
  <style>
    :root{
      --cream:#efe7d8; --cream-lo:#e6ddc9; --cream-hi:#f4eee1; --edge:#cabd9f; --div:#d4c8ac;
      --gold:#c39a63; --gold-lo:#b3894f; --bevel:#c9a978;
      --red:#d8452a; --band:#dc5033; --ink:#463b30; --inkdim:#6f6350;
      --kface:#d8b982; --kface2:#a97b46; --kskirt1:#6a3d20; --kskirt2:#9a6a3c;
      --orange:#f0541f; --orange-hi:#f8794a; --orange-lo:#c23f14;
      --beige:#b7aa89; --beige-hi:#cabe9e; --blue:#93a7b9; --blue-lo:#70889d;
      --brown:#9c7550; --brown-lo:#7a5836; --dark:#37342e;
      --wht:#f7f4ed; --wht-lo:#e7e1d3; --blk:#161310;
      font-family:"Helvetica Neue",Arial,system-ui,sans-serif;
    }
    *{ box-sizing:border-box; }
    html,body{ margin:0; min-height:100%; background:#141210;
      background-image:radial-gradient(circle at 50% -10%,#2b2620,#0e0d0b 78%); }
    body{ padding:16px; display:flex; justify-content:center; user-select:none; -webkit-user-select:none; }

    .mt40{ position:relative; width:100%; max-width:1120px; aspect-ratio:100/31;
      background:linear-gradient(170deg,var(--cream-hi),var(--cream) 44%,var(--cream-lo));
      border:1px solid var(--edge); border-radius:1.4cqw;
      box-shadow:0 2.4cqw 6cqw rgba(0,0,0,.55), inset 0 .12cqw 0 rgba(255,255,255,.6), inset 0 -.4cqw 1cqw rgba(0,0,0,.10);
      container-type:inline-size; overflow:hidden; font-size:1cqw; }
    .a{ position:absolute; } /* absolute-positioned element; coords set inline in cqw */

    /* red lines / band */
    .redline{ position:absolute; background:var(--red); border-radius:.2cqw; }
    .band{ position:absolute; background:var(--band); display:flex; align-items:center; border-radius:.15cqw; }
    .band > span{ text-align:center; color:#fff; font-size:1.15cqw; letter-spacing:.12cqw; font-weight:600; }
    .divl{ position:absolute; width:.14cqw; background:var(--div); }

    /* speaker */
    .slot{ position:absolute; border-radius:.25cqw; background:linear-gradient(180deg,#cec1a3,#b6a582);
      box-shadow:inset 0 .05cqw 0 rgba(255,255,255,.5),0 .05cqw .05cqw rgba(0,0,0,.12); }

    /* knobs */
    .knob{ position:absolute; border-radius:50%; }
    .knob .skirt{ position:absolute; inset:0; border-radius:50%;
      background:repeating-conic-gradient(from 0deg,var(--kskirt1) 0deg 1.6deg,var(--kskirt2) 1.6deg 3.2deg);
      box-shadow:0 .3cqw .5cqw rgba(0,0,0,.4),inset 0 0 .3cqw rgba(0,0,0,.4); }
    .knob .face{ position:absolute; inset:22%; border-radius:50%;
      background:radial-gradient(circle at 42% 34%,var(--kface),var(--kface2) 66%,#8a5f34);
      box-shadow:inset 0 .12cqw .3cqw rgba(255,255,255,.4),0 .1cqw .2cqw rgba(0,0,0,.3); }
    .knob .dial{ position:absolute; inset:0; }
    .knob .dial::before{ content:""; position:absolute; top:8%; left:50%; width:.5cqw; height:24%;
      margin-left:-.25cqw; border-radius:.25cqw; background:#f3ecdd; }
    .txt{ position:absolute; color:var(--ink); }
    .dim{ position:absolute; color:var(--inkdim); }
    .dot{ position:absolute; width:.4cqw; height:.4cqw; border-radius:50%; background:#8a7d64; }

    /* buttons */
    .sq{ position:absolute; border-radius:.5cqw; cursor:pointer;
      box-shadow:0 .25cqw .35cqw rgba(0,0,0,.35),inset 0 .18cqw .25cqw rgba(255,255,255,.35),inset 0 -.2cqw .3cqw rgba(0,0,0,.22); }
    .sq:active{ transform:translateY(.1cqw); }
    .sq.orange{ background:linear-gradient(180deg,var(--orange-hi),var(--orange) 45%,var(--orange-lo)); }
    .sq.beige{ background:linear-gradient(180deg,var(--beige-hi),var(--beige) 55%,#998c6d); }
    .led{ position:absolute; border-radius:50%;
      background:radial-gradient(circle at 40% 35%,#b02516,#5e150c); box-shadow:inset 0 0 .2cqw #000; }
    .led.on{ background:radial-gradient(circle at 40% 35%,#ff6a4a,var(--red)); box-shadow:0 0 .8cqw var(--red); }
    .box{ border:.1cqw solid var(--ink); padding:0 .2cqw; border-radius:.12cqw; }

    /* rhythm slider */
    .rtrack{ position:absolute; border-radius:.4cqw; background:linear-gradient(180deg,#efe9db,#dcd2bb);
      box-shadow:inset 0 .15cqw .35cqw rgba(0,0,0,.28); overflow:hidden; }
    .rtrack .ln{ position:absolute; left:6%; right:6%; top:50%; height:.35cqw; margin-top:-.17cqw; background:#1b1b1b; border-radius:.2cqw; }
    .rrange{ position:absolute; -webkit-appearance:none; appearance:none; background:transparent; margin:0; cursor:pointer; }
    .rrange::-webkit-slider-thumb{ -webkit-appearance:none; width:2.6cqw; height:100%; border-radius:.4cqw;
      background:linear-gradient(180deg,var(--orange-hi),var(--orange) 50%,var(--orange-lo)); border:.08cqw solid #a23414; }
    .rrange::-moz-range-thumb{ width:2.6cqw; height:100%; border-radius:.4cqw;
      background:linear-gradient(180deg,var(--orange-hi),var(--orange) 50%,var(--orange-lo)); border:.08cqw solid #a23414; }
    .rtick{ position:absolute; width:.4cqw; height:.4cqw; background:#40382c; }

    /* slide switches */
    .swt{ position:absolute; border-radius:.45cqw; cursor:pointer;
      background:linear-gradient(180deg,#e7dfcd,#d3c8ae); box-shadow:inset 0 .12cqw .3cqw rgba(0,0,0,.25); }
    .swth{ position:absolute; top:12%; height:76%; border-radius:.35cqw; pointer-events:none;
      box-shadow:0 .12cqw .25cqw rgba(0,0,0,.4),inset 0 .12cqw .12cqw rgba(255,255,255,.4); transition:left .07s; }
    .blue .swth{ background:linear-gradient(180deg,#aebfce,var(--blue) 55%,var(--blue-lo)); }
    .blue .swth::after{ content:""; position:absolute; right:14%; top:24%; width:24%; height:52%; background:#3f4a54; border-radius:.1cqw; }
    .brownsw .swth{ background:linear-gradient(180deg,#b48f68,var(--brown) 55%,var(--brown-lo)); }
    .darksw .swth{ background:linear-gradient(180deg,#54524c,var(--dark) 55%,#1f1e1b); }

    /* CASIO badge */
    .casio{ position:absolute; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(180deg,#c8bb9e,#a99a78); border:.1cqw solid #8b7d5e; border-radius:.3cqw;
      box-shadow:inset 0 .1cqw 0 rgba(255,255,255,.5),0 .15cqw .25cqw rgba(0,0,0,.25); }
    .casio b{ font-weight:800; font-style:italic; letter-spacing:.06cqw; color:#1c1a17; font-size:1.9cqw; }

    /* tone strip */
    .tcell{ position:absolute; top:0; bottom:0; border-right:.1cqw solid #cabd9f; text-align:center; cursor:pointer; overflow:hidden; }
    .tcell .n{ font-size:.95cqw; color:var(--red); font-weight:700; display:block; line-height:1; }
    .tcell .nm{ font-size:.76cqw; color:var(--ink); display:block; line-height:1.05; margin-top:.08cqw; }
    .tcell.sel{ background:rgba(216,69,42,.15); }
    .tcell.sel .nm{ font-weight:700; }

    /* keyboard */
    .board{ position:absolute; background:linear-gradient(180deg,var(--bevel),var(--gold-lo)); }
    .brand{ position:absolute; color:#5c4636; }
    .brand .c{ font-size:1.7cqw; } .brand .m{ font-size:1.9cqw; font-weight:800; letter-spacing:.08cqw; }
    .ul{ position:absolute; height:.1cqw; background:#5c4636; }
    .wkey{ position:absolute; background:linear-gradient(180deg,#fdfcf8,var(--wht-lo));
      border:.08cqw solid #b8b09e; border-radius:0 0 .3cqw .3cqw; cursor:pointer; touch-action:none; }
    .wkey.down{ background:linear-gradient(180deg,#ece6d7,#d6cebb); }
    .bkey{ position:absolute; background:linear-gradient(180deg,#4a4640,var(--blk)); border-radius:0 0 .28cqw .28cqw;
      cursor:pointer; z-index:3; touch-action:none; box-shadow:0 .25cqw .3cqw rgba(0,0,0,.5); }
    .bkey.down{ background:linear-gradient(180deg,#2a2723,#000); }
    .bwk{ position:absolute; background:linear-gradient(180deg,#fdfcf8,#e9e3d4); border:.08cqw solid #b8b09e;
      border-radius:.2cqw; cursor:pointer; touch-action:none; }
    .bwk.down{ background:linear-gradient(180deg,#ece6d7,#d6cebb); }
    .bbk{ position:absolute; background:linear-gradient(180deg,#4a4640,var(--blk)); border-radius:.18cqw;
      cursor:pointer; z-index:3; touch-action:none; box-shadow:0 .2cqw .3cqw rgba(0,0,0,.5); }
    .bbk.down{ background:linear-gradient(180deg,#2a2723,#000); }
    .bklab{ position:absolute; text-align:center; font-size:.85cqw; color:#5c4636; pointer-events:none; }
    .bassdiv{ position:absolute; width:.1cqw; background:#8a7250; opacity:.45; border-radius:.05cqw; }
    .warn{ position:absolute; left:3cqw; bottom:.4cqw; color:var(--red); font-size:1cqw; font-weight:700; display:none; }
  </style>
</head>
<body>
  <div class="mt40" id="mt40"></div>

  <script type="module">
    import * as Juce from "./js/juce/index.js";
    const root=document.getElementById("mt40");

    // ---- native functions ----
    let noteOn,noteOff,synchro,setFill,startStop;
    try{ noteOn=Juce.getNativeFunction("noteOn"); noteOff=Juce.getNativeFunction("noteOff");
      synchro=Juce.getNativeFunction("synchro"); setFill=Juce.getNativeFunction("setFill");
      startStop=Juce.getNativeFunction("startStop"); }catch(e){}

    // ---- placement helper: coords in cqw (1cqw = 1% of case width) ----
    function P(cls, x, y, w, h, html){
      const d=document.createElement("div"); d.className=cls;
      d.style.cssText=`left:${x}cqw;top:${y}cqw;`+(w!=null?`width:${w}cqw;`:"")+(h!=null?`height:${h}cqw;`:"");
      if(html!=null) d.innerHTML=html; root.appendChild(d); return d;
    }
    function T(x,y,txt,size=1.1,cls="txt",w){ const d=P(cls,x,y,w); d.style.fontSize=size+"cqw";
      d.style.textAlign="center"; if(w) d.style.marginLeft="0"; d.innerHTML=txt; return d; }

    // ================= PANEL FRAME =================
    P("redline",14.5,1.5,82.7,0.32);                 // top red line
    [14.5,22,50,66,81,97.2].forEach(x=>P("divl",x,1.5,null,8.6));  // section dividers
    const band=P("band",14.5,9.9,82.7,1.7);
    band.innerHTML='<span style="width:7.5cqw">volume</span><span style="width:28cqw">rhythm</span>'+
      '<span style="width:16cqw">tone</span><span style="width:15cqw">effect</span><span style="flex:1">power</span>';

    // speaker louvers
    for(let i=0;i<11;i++) P("slot",3,2.1+i*0.62,10.4,0.34);

    // ================= KNOBS =================
    function knob(cx,cy,d){ const k=P("knob",cx-d/2,cy-d/2,d,d,'<div class="skirt"></div><div class="face"></div><div class="dial"></div>');
      P("dot",cx-d/2-0.5,cy+d*0.32,null,null); P("dot",cx+d/2+0.1,cy+d*0.32,null,null);
      return k.querySelector(".dial"); }
    const D=3.2;
    const volDial=knob(18.2,3.5,D);
    T(15.2,5.3,"min",0.9,"dim"); T(19.6,5.3,"max",0.9,"dim");
    const tempoDial=knob(30,3.3,D);
    T(25.8,5.05,"slow",0.85,"dim"); T(31.9,5.05,"fast",0.85,"dim"); T(28,5.5,"tempo",0.95,"txt",4);
    const rbvDial=knob(41,3.2,D);
    T(36.9,4.85,"min",0.82,"dim"); T(42.8,4.85,"max",0.82,"dim");
    T(38.3,5.35,"<b>rhythm/bass</b>",0.72,"txt",5.4); T(39.5,5.85,"volume",0.72,"txt",3);

    // ================= RHYTHM buttons + LED + slider =================
    const beatLed=P("led",29.5,4.6,0.85,0.85);
    P("redline",26.6,5.5,7.6,0.09).style.background="#b6a888";  // bracket line
    const orange=P("sq orange",26.6,6.1,2.2,2.2);
    T(25.0,8.55,"<b>casio bass</b>",0.74,"txt",6);
    T(25.0,9.15,'synchro/<span class="box">fill in</span>',0.74,"txt",6);
    const beige=P("sq beige",30.2,6.1,2.2,2.2);
    T(29.7,8.7,"start/stop",0.78,"txt",4.6);
    // rhythm slider (names in a tight zigzag directly above the track)
    const RHY=["samba","waltz","swing","slow rock","pops","rock"];
    P("rtrack",37.6,7.5,10.4,1.7,'<div class="ln"></div>');
    const rrange=document.createElement("input"); rrange.type="range"; rrange.min=0; rrange.max=5; rrange.step=1;
    rrange.className="rrange a"; rrange.style.cssText="left:37.6cqw;top:7.5cqw;width:10.4cqw;height:1.7cqw;";
    root.appendChild(rrange);
    T(41.0,9.35,"rhythm",0.85,"txt",4);
    const zig=[0,0.45,0,0,0,0.45];
    RHY.forEach((nm,i)=>{ const fx=38.3+i*(9.3/5);
      P("rtick",fx,7.3,null,null).style.width=".35cqw"; T(fx-1.6,6.9+zig[i],nm,0.68,"txt",3.4); });

    // ================= TONE (memory / mode) =================
    function slideSwitch(x,y,w,h,cls,positions,labels,label){
      const t=P("swt "+cls,x,y,w,h);
      const th=document.createElement("div"); th.className="swth"; th.style.width=(w/positions*1.4)+"cqw"; t.appendChild(th);
      labels.forEach((tl,i)=>{ T(x+w*(i+0.5)/positions-1.2,y-1.5,tl,0.9,"txt",2.4);
        P("dot",x+w*(i+0.5)/positions-0.2,y-0.5,null,null).style.background="#6b5f4a"; });
      if(label) T(x-1,y+h+0.3,label,0.95,"txt",w+2);
      let idx=0;
      const setThumb=()=>{ const seg=(t.clientWidth-th.clientWidth)/(positions-1); th.style.left=(idx*seg)+"px"; };
      t.addEventListener("click",()=>{ idx=(idx+1)%positions; setThumb(); t.dispatchEvent(new CustomEvent("chg",{detail:idx})); });
      requestAnimationFrame(setThumb); window.addEventListener("resize",setThumb);
      return { set:i=>{idx=i;setThumb();}, get:()=>idx, on:f=>t.addEventListener("chg",e=>f(e.detail)) };
    }
    const memSw =slideSwitch(51.5,4.7,9.3,2.7,"blue",4,["1","2","3","4"],"tone memory");
    const modeSw=slideSwitch(61.8,4.7,3.6,2.7,"blue",2,["play","set"],"mode");

    // ================= EFFECT =================
    const susSw=slideSwitch(67.6,4.7,5.4,2.7,"brownsw",2,["off","on"],"sustain");
    const vibSw=slideSwitch(74.8,4.7,5.4,2.7,"brownsw",2,["off","on"],"vibrato");

    // ================= POWER + CASIO =================
    P("casio",89.6,1.9,7.2,2.9,'<b>CASIO</b>');
    P("led",84.9,4.0,0.9,0.9);
    const pwrSw=slideSwitch(82.6,4.7,5.6,2.7,"darksw",2,["off","on"],""); pwrSw.set(1);

    // ================= TONE STRIP =================
    const TONE=["electric piano","banjo","guitar","harpsichord","xylophone","celesta","glockenspiel","organ",
      "accordion","pipe organ","oriental pipe","brass","cello","synth fuzz","violin","trumpet","funny fuzz",
      "st. ensemble","clarinet","flute","recorder","folk flute"];
    const stripL=3, stripR=97.2, stripW=stripR-stripL, cw=stripW/22;
    let patchState=null, memSlots=[0,7,14,19], curSlot=0;
    const tcells=[];
    TONE.forEach((nm,i)=>{ const c=P("tcell",stripL+i*cw,11.9,cw,3.2,`<span class="n">${i+1}</span><span class="nm">${nm}</span>`);
      c.dataset.i=i; c.addEventListener("click",()=>{ if(patchState){ patchState.setChoiceIndex(i); memSlots[curSlot]=i; } });
      tcells.push(c); });
    function markTones(){ if(!patchState)return; const idx=patchState.getChoiceIndex();
      tcells.forEach(c=>c.classList.toggle("sel",+c.dataset.i===idx)); }

    // ================= KEYBOARD =================
    const boardY=15.3, boardB=30.4;
    P("board",0,boardY,100,boardB-boardY);
    // brand + bass block
    const bx=3.2;
    P("brand",bx,boardY+0.5,20,null,'<span class="c">Casiotone </span><span class="m">MT-40</span>');
    P("ul",bx,boardY+3.0,17); P("ul",bx,boardY+3.3,17);
    T(bx+5.5,boardB-2.0,"bass",1.1,"txt",6).style.color="#5c4636";

    const NN=["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
    const FLAT={1:"C#",3:"E♭",6:"F#",8:"A♭",10:"B♭"};
    const isB=n=>[1,3,6,8,10].includes(((n%12)+12)%12);
    function press(el,n){ if(el.classList.contains("down"))return; el.classList.add("down"); noteOn&&noteOn(n,0.85); }
    function rel(el,n){ if(!el.classList.contains("down"))return; el.classList.remove("down"); noteOff&&noteOff(n); }
    function att(el,n){ el.addEventListener("pointerdown",e=>{el.setPointerCapture(e.pointerId);press(el,n);});
      el.addEventListener("pointerup",()=>rel(el,n)); el.addEventListener("pointercancel",()=>rel(el,n));
      el.addEventListener("pointerleave",e=>{ if(e.buttons) rel(el,n); }); }

    // main manual 53..89 (F3..F6), area x=22..97.2, y=boardY+1..boardB-0.6
    (function(){ const low=53,high=89, X0=22, X1=97.2, Y0=boardY+1.0, Y1=boardB-0.6;
      const whites=[]; for(let n=low;n<=high;n++) if(!isB(n)) whites.push(n);
      const w=(X1-X0)/whites.length; const wm=new Map();
      whites.forEach((n,i)=>{ const k=P("wkey",X0+i*w,Y0,w-0.12,Y1-Y0); wm.set(n,k); att(k,n); });
      for(let n=low;n<=high;n++){ if(!isB(n))continue; const idx=whites.indexOf(n-1);
        const bw=w*0.6; const cx=X0+(idx+1)*w-bw/2; P("bkey",cx,Y0,bw,(Y1-Y0)*0.62); att(root.lastChild,n); }
    })();
    // bass manual 36..50 — discrete keys matching the hardware: black keys in a
    // separate upper band, white-key letters ABOVE the white keys, and thin
    // vertical guide lines at every white-key boundary.
    (function(){ const low=36,high=50, X0=bx, X1=20.8;
      const blackLabelY=boardY+3.5, blackTop=boardY+4.3, blackH=2.3;
      const whiteLabelY=boardY+7.0, whiteTop=boardY+7.9, whiteBot=boardB-2.6;
      const whites=[]; for(let n=low;n<=high;n++) if(!isB(n)) whites.push(n);
      const gap=0.5, w=((X1-X0)-gap*(whites.length-1))/whites.length; const wm=new Map();
      // vertical guide lines at each white-key boundary (through both bands)
      for(let i=0;i<=whites.length;i++){ const gx=X0+i*(w+gap)-gap/2;
        P("bassdiv",gx,blackTop-0.4,null,whiteBot-(blackTop-0.4)); }
      // white keys + letters above them
      whites.forEach((n,i)=>{ const x=X0+i*(w+gap);
        const k=P("bwk",x,whiteTop,w,whiteBot-whiteTop); wm.set(n,k); att(k,n);
        T(x,whiteLabelY,NN[((n%12)+12)%12],0.9,"bklab",w); });
      // black keys (upper band) + accidental labels above them
      for(let n=low;n<=high;n++){ if(!isB(n))continue; const idx=whites.indexOf(n-1);
        const bw=w*0.78; const cx=X0+(idx+1)*(w+gap)-gap/2-bw/2;
        P("bbk",cx,blackTop,bw,blackH); att(root.lastChild,n);
        T(cx,blackLabelY,FLAT[((n%12)+12)%12],0.85,"bklab",bw); }
    })();

    P("warn",0,0).id="warn"; const warn=root.lastChild; warn.className="warn"; warn.textContent="Native bridge unavailable — open inside the plugin host.";

    // ================= BINDINGS =================
    window.mt40SetTransport=(st)=>{ beatLed.classList.toggle("on", st===2); };
    function bindKnob(dial,states){ const s0=states[0];
      const r=()=>{ dial.style.transform=`rotate(${-140+s0.getNormalisedValue()*280}deg)`; };
      s0.valueChangedEvent.addListener(r); s0.propertiesChangedEvent.addListener(r);
      const knob=dial.parentElement; let sy=0,sv=0,act=false;
      knob.addEventListener("pointerdown",e=>{act=true;sy=e.clientY;sv=s0.getNormalisedValue();knob.setPointerCapture(e.pointerId);states.forEach(s=>s.sliderDragStarted&&s.sliderDragStarted());});
      knob.addEventListener("pointermove",e=>{ if(!act)return; const v=Math.max(0,Math.min(1,sv+(sy-e.clientY)/180)); states.forEach(s=>s.setNormalisedValue(v)); });
      const end=()=>{ if(act){act=false;states.forEach(s=>s.sliderDragEnded&&s.sliderDragEnded());} };
      knob.addEventListener("pointerup",end); knob.addEventListener("pointercancel",end); r();
    }
    function bindToggleSwitch(sw,name){ const s=Juce.getToggleState(name);
      const r=()=>sw.set(s.getValue()?1:0); s.valueChangedEvent.addListener(r); sw.on(i=>s.setValue(i===1)); r(); }
    function bindRhythm(name){ const s=Juce.getComboBoxState(name);
      const r=()=>{ rrange.value=s.getChoiceIndex(); }; s.valueChangedEvent.addListener(r); s.propertiesChangedEvent.addListener(r);
      rrange.addEventListener("input",()=>s.setChoiceIndex(parseInt(rrange.value,10))); r(); }
    function bindTone(name){ patchState=Juce.getComboBoxState(name);
      // Seed the active memory slot from the live tone so the first recall of
      // slot 0 restores what is actually playing rather than jumping to patch 0.
      memSlots[curSlot]=patchState.getChoiceIndex();
      patchState.valueChangedEvent.addListener(markTones); patchState.propertiesChangedEvent.addListener(markTones);
      memSw.on(slot=>{ curSlot=slot; patchState.setChoiceIndex(memSlots[slot]); }); markTones(); }

    orange.addEventListener("pointerdown",()=>{ synchro&&synchro(); setFill&&setFill(true); });
    const oUp=()=>setFill&&setFill(false);
    orange.addEventListener("pointerup",oUp); orange.addEventListener("pointerleave",oUp); orange.addEventListener("pointercancel",oUp);
    beige.addEventListener("click",()=>startStop&&startStop());

    try{
      bindKnob(volDial,[Juce.getSliderState("master_vca_gain")]);
      bindKnob(tempoDial,[Juce.getSliderState("host_bpm")]);
      bindKnob(rbvDial,[Juce.getSliderState("rhythm_bus_gain"),Juce.getSliderState("bass_osc_gain")]);
      bindToggleSwitch(susSw,"env_release_mult");
      bindToggleSwitch(vibSw,"global_lfo_on");
      bindRhythm("active_rhythm_idx");
      bindTone("active_patch_idx");
    }catch(e){ warn.style.display="block"; }
  </script>
</body>
