name: Build Windows VST

# Builds the Phenotype plugin (in phenotype/) on real Windows runners, for both
# x64 and x86 (32-bit). Produces VST2 (.dll, for legacy hosts like FL Studio 11)
# and VST3, and publishes each arch's package onto an orphan branch
# (ci-win-x64 / ci-win-x86) for programmatic retrieval. Artifact upload is a
# best-effort extra (storage quota may reject it).
#
# VST2 requires Steinberg's withdrawn VST 2.4 SDK, supplied by the repo owner
# under phenotype/sdk/vstsdk2.4. Without it, only VST3 is emitted.

#  Manual-only: builds run when dispatched (Actions tab -> Run workflow, or via
#  API/tooling), never automatically on push, so pushes don't spend CI minutes.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x64 keeps the WebGL WebView UI (modern 64-bit hosts).
          - { cmake_arch: x64,   label: x64, branch: ci-win-x64, native: "OFF" }
          # x86 targets legacy hosts (FL Studio 11). Built native=ON so it ALWAYS
          # uses the full native editor — no WebView compiled in. FL Studio 11 is
          # a 32-bit host where the Edge WebView2 control can be "present" in the
          # registry yet still fail to serve the bundled UI (blank "no se puede
          # acceder a https://juce.backend" page), so hybrid detection isn't
          # enough. The native editor is a complete first-class UI, so x86 ships
          # it unconditionally.
          - { cmake_arch: Win32, label: x86, branch: ci-win-x86, native: "ON" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: phenotype/ui
        run: |
          npm ci
          npm run build

      - name: Install WebView2 SDK (NuGet)
        working-directory: phenotype
        shell: pwsh
        run: nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory nuget -ExcludeVersion

      - name: Configure (CMake, ${{ matrix.label }})
        working-directory: phenotype
        shell: pwsh
        run: >
          cmake -B build -A ${{ matrix.cmake_arch }}
          -DPHENOTYPE_NATIVE_EDITOR=${{ matrix.native }}
          "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=${{ github.workspace }}/phenotype/nuget"

      - name: Build (Release, ${{ matrix.label }})
        working-directory: phenotype
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel --target Phenotype_VST3
          cmake --build build --config Release --parallel --target Phenotype_VST

      - name: Package (${{ matrix.label }})
        working-directory: phenotype
        shell: pwsh
        run: |
          $out = "pkg"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $dll = Get-ChildItem -Path build -Recurse -File -Filter 'Phenotype.dll' | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName (Join-Path $out 'Phenotype.dll') ; Write-Host "VST2: $($dll.FullName)" }
          else { Write-Warning 'VST2 .dll not found' }
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter 'Phenotype.vst3' | Select-Object -First 1
          if ($vst3) { Copy-Item $vst3.FullName (Join-Path $out 'Phenotype.vst3') -Recurse ; Write-Host "VST3: $($vst3.FullName)" }
          Compress-Archive -Path "$out/*" -DestinationPath "Phenotype-windows-${{ matrix.label }}.zip" -Force
          Get-ChildItem "Phenotype-windows-${{ matrix.label }}.zip"

      - name: Publish to retrieval branch
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ${{ matrix.branch }}
          git rm -r --cached . >/dev/null 2>&1 || true
          git add -f phenotype/Phenotype-windows-${{ matrix.label }}.zip
          git commit -m "CI: Windows ${{ matrix.label }} VST build ($GITHUB_SHA)"
          git push -f origin ${{ matrix.branch }}

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: Phenotype-windows-${{ matrix.label }}
          path: phenotype/Phenotype-windows-${{ matrix.label }}.zip
          if-no-files-found: warn
