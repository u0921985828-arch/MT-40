name: Build Windows VST3

# Builds the Phenotype plugin (in phenotype/) on a real Windows runner, since
# the WebView2 UI backend needs MSVC + the Windows SDK and cannot be produced
# from Linux. Publishes the packaged .vst3 both as a normal workflow artifact
# and onto an orphan branch (ci-windows-build) for programmatic retrieval.

on:
  workflow_dispatch:
  push:
    branches: [claude/vst3-granular-plugin-j7rj44]
    paths:
      - "phenotype/**"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: phenotype/ui
        run: |
          npm ci
          npm run build

      - name: Install WebView2 SDK (NuGet)
        working-directory: phenotype
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.1901.177 -OutputDirectory nuget -ExcludeVersion
          Get-ChildItem nuget/Microsoft.Web.WebView2/build/native/include | Select-Object -First 3

      - name: Configure (CMake)
        working-directory: phenotype
        shell: pwsh
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          "-DJUCE_WEBVIEW2_PACKAGE_LOCATION=${{ github.workspace }}/phenotype/nuget/Microsoft.Web.WebView2"

      - name: Build VST3 (Release)
        working-directory: phenotype
        run: cmake --build build --config Release --parallel --target Phenotype_VST3

      - name: Package .vst3
        working-directory: phenotype
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -Path build -Recurse -Directory -Filter 'Phenotype.vst3' | Select-Object -First 1
          if (-not $bundle) { throw 'Phenotype.vst3 bundle not found' }
          Write-Host "Bundle: $($bundle.FullName)"
          Compress-Archive -Path $bundle.FullName -DestinationPath Phenotype-vst3-windows-x64.zip -Force
          Get-ChildItem Phenotype-vst3-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Phenotype-vst3-windows-x64
          path: phenotype/Phenotype-vst3-windows-x64.zip
          if-no-files-found: error

      - name: Publish to retrieval branch
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-windows-build
          git rm -r --cached . >/dev/null 2>&1 || true
          git add -f phenotype/Phenotype-vst3-windows-x64.zip
          git commit -m "CI: Windows VST3 build artifact ($GITHUB_SHA)"
          git push -f origin ci-windows-build
