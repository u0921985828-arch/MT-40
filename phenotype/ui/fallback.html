<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phenotype</title>
    <style>
      :root { color-scheme: light; }
      html, body {
        margin: 0; height: 100%;
        background: #f4f4f4; color: #222222;
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        display: grid; place-items: center; text-align: center;
      }
      h1 { letter-spacing: 0.35em; font-size: 22px; margin: 0 0 12px; }
      h1 span { color: #00ff00; }
      p { max-width: 420px; line-height: 1.5; opacity: 0.85; font-size: 13px; }
      code {
        background: #222; color: #00ff00; padding: 2px 6px;
        border: 1px solid #ff00ff;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>PHENO<span>TYPE</span></h1>
      <p>
        Frontend bundle not embedded. Build it, then rebuild the plugin:
        <br /><br />
        <code>cd ui &amp;&amp; npm ci &amp;&amp; npm run build</code>
      </p>
    </div>
  </body>
</html>
